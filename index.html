<!doctype html>
<html lang="es" data-marca="brio">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="description" content="Prototypator: workflow de prototipado con IA, sobre el design system Ready." />

        <!-- Tipografías de las marcas: Plus Jakarta Sans (Brío), Source Serif 4 e Inter (Ancla), Balsamiq Sans (Boceto) -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Balsamiq+Sans:ital,wght@0,400;0,700;1,400;1,700&family=Inter:ital,opsz,wght@0,14..32,400..700;1,14..32,400..700&family=Plus+Jakarta+Sans:ital,wght@0,400..800;1,400..800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400..700;1,8..60,400..700&display=swap"
            rel="stylesheet"
        />

        <title>Prototypator</title>

        <script>
            // Aplica la marca y el modo guardados antes de dibujar la página, para que no parpadee.
            try {
                var marca = localStorage.getItem("ready-marca");
                if (marca === "brio" || marca === "ancla" || marca === "boceto") document.documentElement.dataset.marca = marca;
                var modo = localStorage.getItem("ui-theme");
                var oscuro = modo === "dark" || (!modo && window.matchMedia("(prefers-color-scheme: dark)").matches);
                document.documentElement.classList.toggle("dark-mode", oscuro);
            } catch (e) {}
        </script>
    </head>

    <body class="size-full bg-primary antialiased">
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
